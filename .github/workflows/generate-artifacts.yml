name: Generate artifacts

on:
  push:
    branches: [init-kb]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Fetch favicon placeholder
        run: curl -fsSL "https://raw.githubusercontent.com/AdguardTeam/KnowledgeBase/master/static/img/favicon.ico" -o static/img/favicon.ico

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml static/img/favicon.ico
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add generated lockfile and favicon placeholder"
          git push
